<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- GUIDE 재연출 예시: 운항 현황 한눈에 보기 (C_dash, Figma 72:80015)
     요소는 화면 캡처가 아니라 Figma 노드별 개별 export(a/*.png, 3x, 배경 투명).
     연출 레퍼런스: youtu.be/2aZELcvi7b4 (밝은 배경 · 파란 알약 마스킹) / youtu.be/m7PMyzMbI4c (휩 전환 · 방향 모션블러) -->
<style>
  @font-face { font-family: KAS; font-weight: 400; src: url('file:///C:/Users/Admin/AppData/Local/Microsoft/Windows/Fonts/KoreanAirSansKR-Regular.ttf'); }
  @font-face { font-family: KAS; font-weight: 700; src: url('file:///C:/Users/Admin/AppData/Local/Microsoft/Windows/Fonts/KoreanAirSansKR-Bold.ttf'); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse 80% 70% at 45% 50%, #F7F9FC 0%, #EDF0F6 60%, #E3E8F1 100%); font-family: KAS; letter-spacing: -0.02em; }
  #screen { position: absolute; left: 0; top: -180px; width: 1920px; height: 1536px; }
  .L { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .L img { display: block; width: 100%; height: 100%; }
  .crop { width: 100%; height: 100%; background-repeat: no-repeat; }
  .pill { position: absolute; border-radius: 999px; display: flex; align-items: center; justify-content: center; white-space: nowrap; transform-origin: 0 50%; font-family: KAS; letter-spacing: -0.02em; }
  .pill span { display: block; }
  #title { position: absolute; left: 110px; top: 92px; color: #06176A; font-weight: 700; font-size: 58px; white-space: nowrap; }
  #sub { position: absolute; left: 112px; top: 172px; color: #6B7387; font-size: 26px; white-space: nowrap; }
  .ch { display: inline-block; white-space: pre; }
  .cap { position: absolute; left: 1290px; top: 0; width: 560px; }
  .cap .num { position: absolute; left: 0; top: 0; width: 60px; height: 60px; border-radius: 50%; background: #F84613; color: #fff; font-weight: 700; font-size: 30px; display: flex; align-items: center; justify-content: center; }
  .cap .name { position: absolute; left: 84px; top: -2px; color: #06176A; font-weight: 700; font-size: 50px; white-space: nowrap; }
  .cap .desc { position: absolute; left: 84px; top: 80px; width: 520px; color: #5F6A85; font-size: 27px; line-height: 1.5; word-break: keep-all; }
  .cap .clip { position: absolute; left: 84px; top: -10px; width: 600px; height: 200px; overflow: hidden; }
</style></head>
<body>
<div id="stage">
  <img id="screen" src="a/screen.png">
  <svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
  <div id="layers"></div>
  <div id="title"></div><div id="sub"></div>
  <div id="caps"></div>
</div>
<script>
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const easeInOut = p => { p = clamp(p); return p < .5 ? 4 * p ** 3 : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const easeIn = p => { p = clamp(p); return p * p * p; };
const easeOut = p => 1 - Math.pow(1 - clamp(p), 3);
// 쫀득 키(full2.html과 같은 LUT): 짧게 확 치고 나가 길게 서서히 멈춤
const CHEW = (() => { const N = 400, p = .07, v = []; let acc = 0;
  for (let i = 0; i <= N; i++) { const t = i / N, sp = t < p ? Math.pow(t / p, 1.6) : .82 * Math.exp(-(t - p) / .085) + .18 * Math.exp(-(t - p) / .42); acc += sp; v.push(acc); }
  return v.map(x => x / acc); })();
const chewy = t => { if (t <= 0) return 0; if (t >= 1) return 1; const f = t * 400, i = Math.floor(f); return CHEW[i] + (CHEW[i + 1] - CHEW[i]) * (f - i); };
// 오버슈트 1회 (알약 붙을 때)
const backOut = p => { p = clamp(p); const c = 1.4; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

// ── 화면 좌표(Figma 1280 프레임) → 스테이지: 1.5배, 위로 180 (기존 영상 C_dash 스크롤 위치)
const S0 = 1.5, OY = -180, home = (fx, fy) => [fx * S0, fy * S0 + OY];

// ── 섹션 타이밍
const SEC = [2.9, 6.7, 10.5, 14.3], OUT = 18.1, END = 19.6;
window.DURATION = 20.4;

// ── 레이어 정의: 이미지(노드별 export), 1x 크기, 화면 위치, 섹션 배치(x,y,scale), 그룹
// crop: 한 장(72:80329 객실 구역 링 줄)에서 항목별로 잘라 씀 (같은 노드 export, 배경 투명)
const RINGX = [0, 134, 269, 403, 537];
const D = [
  // 그룹 0: 운항 상태 바 (Flight Stat Bar 72:80240 하위 프레임 4개 — 흰 바 배경 없이 내용만)
  { g: 0, white: 1, src: 'sb_pax', w: 174, h: 54, fx: 72 + 24, fy: 230 + 11, at: [117, 420, 2.4] },
  { g: 0, white: 1, src: 'sb_phase', w: 220, h: 56, fx: 72 + 357, fy: 230 + 10, at: [635, 418, 2.4] },
  { g: 0, white: 1, src: 'sb_arr', w: 114, h: 58, fx: 72 + 737, fy: 230 + 9, at: [117, 664, 2.4] },
  { g: 0, white: 1, src: 'sb_next', w: 118, h: 58, fx: 72 + 1010, fy: 230 + 9, at: [635, 664, 2.4] },
  // 그룹 1: 업무 요약 카드 4장
  { g: 1, src: 'card1', w: 249, h: 182, fx: 73, fy: 625, at: [190, 300, 1.75], shadow: 1 },
  { g: 1, src: 'card2', w: 249, h: 182, fx: 73 + 253, fy: 625, at: [654, 300, 1.75], shadow: 1 },
  { g: 1, src: 'card3', w: 249, h: 182, fx: 73, fy: 625 + 185, at: [190, 647, 1.75], shadow: 1 },
  { g: 1, src: 'card4', w: 249, h: 182, fx: 73 + 253, fy: 625 + 185, at: [654, 647, 1.75], shadow: 1 },
  // 그룹 2: 객실 구역 현황 (제목 · 설명 · 링 5개)
  { g: 2, src: 'zonetitle', w: 287 / 3, h: 44 / 3, fx: 604, fy: 318 + 3, at: [112, 330, 2.6] },
  { g: 2, src: 'zonedesc', w: 818 / 3, h: 33 / 3, fx: 604, fy: 351 + 2, at: [114, 392, 2.2] },
  ...RINGX.map((x, i) => ({ g: 2, white: 1, src: 'zonerings', crop: 1, cx: x, cw: 86, w: 86, h: 83, fx: 604 + x, fy: 378, at: [110 + i * 221, 480, 1.65], ring: i })),
  // 그룹 3: 구역 요약 (Zone Detail 72:80392 하위 항목 5개 — 흰 카드·구분선 없이)
  ...[['zd_zone', 45, 20], ['zd_crew', 26, 155], ['zd_todo', 54, 271], ['zd_next', 54, 415], ['zd_req', 44, 559]].map(([src, w, x], i, a) => {
    const X0 = 190, sc = 2.6, gap = 80; let px = X0; for (let j = 0; j < i; j++) px += a[j][1] * sc + gap;
    return { g: 3, white: 1, src, w, h: 37, fx: 604 + x, fy: 723 + 14, at: [px, 520, sc] }; }),
];

// ── 파란 알약 (레퍼런스 1 마스킹): 요소 안 텍스트 위치(Figma 실측, 요소 1x 좌표)에 같은 글자를 흰색으로
// [레이어 index, 글자, x, y, w, h, 글자크기, 굵기, 스킴]
const BLUE = ['#3E6BEB', '#fff'], WHITE = ['#fff', '#06176A'];
const PILLS = [
  [0, '341 / 368명', 56, 14, 118, 26, 20, 700, BLUE],
  [1, '순항', 100, 39, 21, 14, 11, 700, BLUE],
  [2, '11:42', 0, 16, 58, 26, 20, 700, BLUE],
  [3, '00:50', 0, 16, 58, 26, 20, 700, BLUE],
  [4, '지금 3 · 15분 2 · 30분 2', 35, 130, 0, 18, 14, 400, WHITE],
  [5, '물 1 · 좌석 1 · 기타 1', 35, 130, 0, 18, 14, 400, WHITE],
  [6, '첫 번째 식사 · 2분 남음', 35, 146, 0, 18, 14, 400, WHITE],
  [7, '14K 알레르기 · UM · 정하린', 41, 146, 0, 18, 14, 400, WHITE],
  [11, '프레스티지 메인', 3, 52, 81, 15, 12, 700, BLUE, 'c'],
  [15, 'P 메인', 0, 16, 45, 21, 16, 700, BLUE],
  [16, '4명', 0, 16, 26, 21, 16, 700, BLUE],
  [17, '3건', 14, 16, 26, 21, 16, 700, BLUE],
  [18, '00:50', 0, 16, 46, 21, 16, 700, BLUE],
  [19, '1건', 9, 16, 26, 21, 16, 700, BLUE],
];
const CAPS = [
  ['운항 상태 바', '탑승 인원, 비행 단계, 도착 시간, 다음 서비스입니다.'],
  ['업무 요약 카드', '미완료 업무 · 승객 요청 · 다음 서비스 · 주의 승객 수입니다.'],
  ['객실 구역 현황', '구역별 진행률과 남은 업무를 보여줍니다.'],
  ['구역 요약', '선택 구역의 담당 인원 · 미완료 업무 · 다음 서비스입니다.'],
];
const TITLE = '운항 현황 한눈에 보기', SUB = '라운지에서 정한 계획이 반영된 비행 상태와 남은 업무를 한 화면에서 봅니다.';

// ── DOM 구성
const layersEl = document.getElementById('layers'), defs = document.getElementById('defs');
const L = D.map((d, i) => {
  const el = document.createElement('div'); el.className = 'L'; el.style.width = d.w + 'px'; el.style.height = d.h + 'px';
  if (d.white) { const cv = document.createElement('canvas'); cv.style.cssText = 'display:block;width:100%;height:100%'; el.appendChild(cv); d.cv = cv; }
  else { const im = document.createElement('img'); im.src = `a/${d.src}.png`; el.appendChild(im); }
  defs.insertAdjacentHTML('beforeend', `<filter id="mb${i}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0 0"/></filter>`);
  layersEl.appendChild(el); return { d, el, blur: defs.lastElementChild.firstElementChild, pills: [] };
});
const mc = document.createElement('canvas').getContext('2d');
PILLS.forEach(([li, text, x, y, w, h, fs, wt, [bg, fg], align], k) => {
  mc.font = `${wt} ${fs}px KAS`; const tw = mc.measureText(text).width * 1 - text.length * fs * .02; // letter-spacing -0.02em 보정
  const padX = fs * .42, ph = h + fs * .34, pw = tw + padX * 2;
  const left = align === 'c' ? x + w / 2 - pw / 2 : x - padX;
  const p = document.createElement('div'); p.className = 'pill';
  Object.assign(p.style, { left: left + 'px', top: (y + h / 2 - ph / 2) + 'px', width: pw + 'px', height: ph + 'px', background: bg, color: fg, fontSize: fs + 'px', fontWeight: wt,
    boxShadow: bg === '#fff' ? '0 2px 6px rgba(0,0,0,.25)' : '0 2px 6px rgba(40,80,200,.28)' });
  p.innerHTML = `<span>${text}</span>`; L[li].el.appendChild(p); L[li].pills.push({ p, span: p.firstChild, k });
});
const title = document.getElementById('title'), sub = document.getElementById('sub');
const chars = (el, s) => [...s].map(c => { const sp = document.createElement('span'); sp.className = 'ch'; sp.textContent = c; el.appendChild(sp); return sp; });
const TC = chars(title, TITLE), SC = chars(sub, SUB);
const capsEl = document.getElementById('caps');
const CP = CAPS.map(([n, d], i) => {
  const c = document.createElement('div'); c.className = 'cap'; c.style.top = '440px';
  c.innerHTML = `<div class="num">${i + 1}</div><div class="clip"><div class="name">${n}</div></div><div class="desc">${d}</div>`;
  capsEl.appendChild(c); return { c, num: c.querySelector('.num'), name: c.querySelector('.name'), desc: c.querySelector('.desc') };
});

// ── 포즈 계산
// 그룹별: 섹션 전엔 화면 자리(home), S1에서 그룹0은 home→배치로 날아가고 나머지는 왼쪽으로 휩 아웃,
// 이후 그룹은 오른쪽에서 휩 인 → 다음 섹션 때 왼쪽으로 휩 아웃. OUT에서 전부 화면 자리로 복귀.
const WHIP = 2300;
function pose(i, t) {
  const { d } = L[i], g = d.g, [hx, hy] = home(d.fx, d.fy), hs = S0, [ax, ay, as] = d.at;
  const gi = D.filter(x => x.g === g).indexOf(d), st = gi * .045; // 그룹 안 순서 지연
  const S = SEC[g], E = g < 3 ? SEC[g + 1] : OUT;
  let x = hx, y = hy, s = hs, o = 1, ry = 0;
  // 분해(1.0~2.2): 화면 배경이 빠지면서 요소가 살짝 떠오름 (위치 고정)
  const lift = easeInOut((t - 1.15 - gi * .03) / .8);
  if (t < SEC[0]) { const k = g === 0 ? 0 : 0; return { x, y: y - 6 * lift, s, o, ry, lift }; }
  // S1 시점에 그룹 1~3은 왼쪽으로 빠짐
  if (g > 0 && t < S) {
    const k = easeIn((t - SEC[0] + .05 - (3 - g) * .03 - st) / .42);
    return { x: hx - WHIP * k, y: hy - 6, s, o, ry, lift: 1 };
  }
  // 섹션 진입
  if (t < E - .02 || g === 3) {
    let k;
    if (g === 0) k = chewy((t - S - st) / 1.15);                 // home → 배치 (날아옴)
    else k = chewy((t - (S - .14) - st) / 1.05);                // 오른쪽에서 휩 인
    const fromX = g === 0 ? hx : ax + WHIP, fromY = g === 0 ? hy - 6 : ay, fromS = g === 0 ? hs : as;
    x = lerp(fromX, ax, k); y = lerp(fromY, ay, k); s = lerp(fromS, as, k);
    if (g === 1) ry = lerp(-38, 0, chewy((t - (S - .14) - st * 2) / 1.2));
    if (g < 3 || t < OUT) return { x, y, s, o, ry, lift: 1 };
  }
  if (g < 3 && t < OUT) { // 다음 섹션으로 왼쪽 휩 아웃
    const k = easeIn((t - (E - .2) - st) / .38);
    return { x: ax - WHIP * k, y: ay, s: as, o, ry, lift: 1 };
  }
  // 복귀: 그룹3은 배치→home, 나머지는 왼쪽 밖→home
  const k = chewy((t - OUT - (g === 3 ? 0 : .08 + (2 - g) * .05) - st) / 1.25);
  const fx0 = g === 3 ? ax : ax - WHIP, fy0 = ay, fs0 = as;
  return { x: lerp(fx0, hx, k), y: lerp(fy0, hy - 6, k) + 6 * easeInOut((t - OUT - 1.1) / .5), s: lerp(fs0, hs, k), o, ry, lift: 1 - easeInOut((t - OUT - .9) / .7) };
}

function render(t) {
  // 화면 배경: 1.0~2.0 사라짐, 복귀 때 다시 나타남
  const scrA = 1 - easeInOut((t - 1.0) / 1.0) + easeInOut((t - OUT - .95) / .6);
  document.getElementById('screen').style.opacity = clamp(scrA);
  L.forEach((l, i) => {
    const p = pose(i, t), q = pose(i, t - 1 / 60);
    // 방향 모션블러: 프레임간 이동량 → 진행 방향 블러
    const dx = (p.x - q.x), dy = (p.y - q.y), sp = Math.hypot(dx, dy);
    const bx = Math.min(Math.abs(dx) * .32, 60), by = Math.min(Math.abs(dy) * .32, 30);
    l.blur.setAttribute('stdDeviation', `${bx.toFixed(2)} ${by.toFixed(2)}`);
    const sh = l.d.shadow ? ` drop-shadow(0 ${(14 * p.lift).toFixed(1)}px ${(26 * p.lift).toFixed(1)}px rgba(10,30,100,${(.22 * p.lift).toFixed(3)}))` : '';
    l.el.style.filter = (sp > .5 ? `url(#mb${i})` : '') + sh || 'none';
    const persp = p.ry ? `perspective(${1400 / p.s}px) rotateY(${p.ry}deg) ` : '';
    l.el.style.transform = `translate(${p.x}px, ${p.y}px) scale(${p.s}) ${persp}`;
    l.el.style.opacity = p.o;
    // 링 섹션: 알약 붙은 뒤 선택 안 된 구역은 흐리게
    if (l.d.ring !== undefined) l.el.style.opacity = l.d.ring === 1 ? 1 : 1 - .68 * easeInOut((t - SEC[2] - 1.75) / .5) * (1 - easeInOut((t - SEC[3] + .3) / .3));
    // 알약
    l.pills.forEach(({ p: el, span, k }) => {
      const g = l.d.g, order = PILLS.filter(x => D[x[0]].g === g).findIndex(x => x === PILLS[k]);
      const t0 = SEC[g] + 1.0 + order * .3;
      const a = clamp((t - t0) / .55), back = 1 - easeInOut((t - OUT - .2) / .4);
      if (a <= 0 || back <= 0) { el.style.opacity = 0; return; }
      // 스티커처럼 왼쪽에서 말려 붙음: rotateY -100→0 + 살짝 기울기, 1회 오버슈트
      const ry = lerp(-100, 0, backOut(a)), rz = lerp(-14, 0, easeOut(a * 1.2)), sx = lerp(.35, 1, backOut(a));
      el.style.opacity = clamp(a * 4) * back;
      el.style.transform = `perspective(200px) rotateY(${ry}deg) rotate(${rz}deg) scaleX(${sx})`;
      span.style.opacity = clamp((a - .35) / .3);
    });
  });
  // 제목: 글자별로 블러 풀리며 나타남 → 복귀 때 사라짐
  const tOut = 1 - easeInOut((t - OUT) / .45);
  TC.forEach((c, i) => { const a = easeOut((t - 3.05 - i * .035) / .45); c.style.opacity = a * tOut; c.style.filter = `blur(${(1 - a) * 8}px)`; c.style.transform = `translateY(${(1 - a) * 14}px)`; });
  SC.forEach((c, i) => { const a = easeOut((t - 3.45 - i * .012) / .4); c.style.opacity = a * tOut; c.style.filter = `blur(${(1 - a) * 6}px)`; });
  // 캡션: 섹션 들어올 때 번호 → 이름(아래에서 올라옴) → 설명, 나갈 때 왼쪽으로 블러 아웃
  CP.forEach((c, i) => {
    const S = SEC[i], E = i < 3 ? SEC[i + 1] : OUT + .1;
    const nIn = backOut((t - S - .35) / .5), nm = chewy((t - S - .45) / .9), ds = easeOut((t - S - .7) / .6);
    const out = easeIn((t - (E - .2)) / .35), live = t > S && out < 1;
    c.c.style.display = live ? 'block' : 'none'; if (!live) return;
    c.c.style.transform = `translateX(${-260 * out}px)`; c.c.style.opacity = 1 - out; c.c.style.filter = out > 0 ? `blur(${out * 10}px)` : 'none';
    c.num.style.transform = `scale(${clamp(nIn, 0, 2)})`; c.num.style.opacity = clamp(nIn * 3);
    c.name.style.transform = `translateY(${(1 - nm) * 80}px)`;
    c.desc.style.opacity = ds; c.desc.style.transform = `translateY(${(1 - ds) * 16}px)`;
  });
}
window.render = render;
const whiteToAlpha = d => new Promise(res => { const im = new Image(); im.onload = () => { const cv = d.cv; cv.width = d.crop ? d.cw * 3 : im.width; cv.height = im.height; const c = cv.getContext("2d"); c.drawImage(im, d.crop ? -d.cx * 3 : 0, 0); const id = c.getImageData(0, 0, cv.width, cv.height), a = id.data;
  for (let i = 0; i < a.length; i += 4) { const al = Math.max(255 - a[i], 255 - a[i + 1], 255 - a[i + 2]) / 255 * (a[i + 3] / 255); if (al <= 0) { a[i + 3] = 0; continue; } for (let j = 0; j < 3; j++) a[i + j] = 255 - (255 - a[i + j]) / al * (a[i+3]/255); a[i + 3] = al * 255; }
  c.putImageData(id, 0, 0); res(); }; im.src = `a/${d.src}.png`; });
window.ready = Promise.all([...D.filter(d => d.white).map(whiteToAlpha), document.fonts.load('700 20px KAS'), document.fonts.load('400 20px KAS'),
  ...[...document.images].map(im => im.decode().catch(() => {}))]).then(() => { render(0); });
</script>
</body></html>
